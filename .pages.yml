media:
  input: media
  output: /media
  rename: safe
  categories:
    - image

content:
  - name: website
    label: Website Content
    type: file
    path: content/site.json
    format: json
    fields:
      - name: business
        label: Business Details
        type: object
        fields:
          - name: name
            label: Business Name
            type: string
          - name: phone
            label: Phone Number
            type: string
          - name: email
            label: Email Address
            type: string
          - name: location
            label: Main Service Location
            type: string
          - name: topbar
            label: Top Announcement
            type: string
          - name: hours
            label: Opening Hours Text
            type: string

      - name: hero
        label: Homepage Hero
        type: object
        fields:
          - name: eyebrow
            label: Small Heading
            type: string
          - name: title
            label: Main Heading
            type: string
          - name: description
            label: Introduction
            type: text
          - name: button
            label: Button Text
            type: string
          - name: note
            label: Small Supporting Text
            type: string
          - name: tagTitle
            label: Image Badge Heading
            type: string
          - name: tagText
            label: Image Badge Text
            type: string
          - name: image
            label: Main Hero Image
            type: image
            options:
              path: images

      - name: servicesSection
        label: Services Section Heading
        type: object
        fields:
          - name: title
            label: Section Heading
            type: string
          - name: description
            label: Section Description
            type: text

      - name: services
        label: Services
        type: object
        list:
          collapsible:
            collapsed: true
            summary: "{title}"
        fields:
          - name: title
            label: Service Name
            type: string
          - name: description
            label: Service Description
            type: text
          - name: image
            label: Service Image
            type: image
            options:
              path: images

      - name: about
        label: About Section
        type: object
        fields:
          - name: title
            label: Heading
            type: string
          - name: description
            label: Description
            type: text
          - name: image
            label: Main Image
            type: image
            options:
              path: images
          - name: smallImage
            label: Secondary Image
            type: image
            options:
              path: images

      - name: benefits
        label: Business Benefits
        type: string
        list: true

      - name: processSection
        label: Process Section Heading
        type: object
        fields:
          - name: title
            label: Heading
            type: string
          - name: description
            label: Description
            type: text

      - name: process
        label: How It Works Steps
        type: object
        list:
          collapsible:
            collapsed: true
            summary: "{title}"
        fields:
          - name: title
            label: Step Heading
            type: string
          - name: description
            label: Step Description
            type: text

      - name: areasSection
        label: Service Areas Heading
        type: object
        fields:
          - name: title
            label: Heading
            type: string
          - name: description
            label: Description
            type: text

      - name: areas
        label: Service Areas
        type: string
        list: true

      - name: contact
        label: Contact Section
        type: object
        fields:
          - name: title
            label: Heading
            type: string
          - name: description
            label: Description
            type: text

settings:
  content: true
  commit:
    identity: user